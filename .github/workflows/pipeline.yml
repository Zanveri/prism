# A pipeline do Prism (RN-ABERTO-005 e RN-GITHUB-002): o workflow de ENTRADA. Ele só existe para dizer QUANDO a pipeline roda e
# em que ordem os assuntos vêm; cada assunto é um workflow reutilizável deste mesmo diretório (verificar, integrar, seguranca,
# empacotar, lancar e paginas), e cada passo deles chama um roteiro de scripts/ci/ (o das páginas só usa actions do GitHub). O que
# cada arquivo faz, a ordem das etapas e o que o repositório precisa ter configurado estão em docs/ci.md.
#
# QUANDO: só no merge em `develop` e em `main` (um push nesses ramos, que as regras de ramo só deixam acontecer pelo merge de um
# pull request). Pull request, tag, outro ramo e qualquer outro evento não disparam nada: não há `pull_request`,
# `pull_request_target`, `workflow_run`, `schedule` nem `workflow_dispatch` (este último deixaria quem tem escrita rodar a
# pipeline, com o job que publica, a partir de um ramo que não passou por merge). A release criada pelo job de lançamento cria a
# tag com o GITHUB_TOKEN, e um evento do GITHUB_TOKEN não cria execução nova.
#
# O TOKEN: `permissions: {}` aqui e em todo workflow; cada job pede só o que usa, e só o de lançamento tem `contents: write`
# (cria a release, que cria a tag). O de CodeQL tem `security-events: write`, que só grava os achados da varredura. O de páginas
# tem `pages: write` e `id-token: write`, que só servem para publicar o site no GitHub Pages.
#
# UM MERGE DE CADA VEZ em cada ramo, na ordem em que chegaram, sem cancelar o que está rodando: a execução de um merge planeja o
# número do beta no começo e grava esse número dentro dos pacotes (o app empacotado diz que é o beta), e por isso a execução
# seguinte do mesmo ramo só começa quando a anterior termina. `queue: max` guarda até 100 execuções na fila (sem ele, a que espera
# é cancelada quando chega outra). As execuções da develop e as da main são filas separadas.
#
# AS PÁGINAS: o site de `site/` é publicado a cada merge na `develop` (o ramo padrão, o único que o ambiente `github-pages` deixa
# publicar), sem esperar o empacotamento e sem que ninguém espere por ele. Na `main` não rodam.
#
# CADA PLATAFORMA É INDEPENDENTE (decisão do dono, 2026-10-20): o pacote de uma plataforma que falha, é cancelado ou fica sem runner
# não segura o lançamento das outras. O `empacotar` espera `verificar` e `seguranca` (sem eles não há pacote), e o `lancar` roda
# mesmo com o `empacotar` em falha: o `!cancelled()` (que, ao contrário do `success()` implícito, não pula o job por causa de um
# `needs` que falhou) e os resultados de `verificar` e `seguranca` exigidos à mão; uma execução cancelada por alguém não lança.
# Nunca `always()`: ele rodaria o lançamento até numa execução cancelada, e o `check-workflows.sh` o reprova. O que entra na release
# é decidido pelo `publish-release.sh`, que publica as plataformas que vieram inteiras e recusa se nenhuma veio. O macOS só é
# empacotado na `main` (o `if` do job dele, em `empacotar.yml`): num beta, a falta dele é o esperado.
#
# Nenhum workflow nem action de fora: só `actions/*` e `github/*`, fixadas pelo SHA do commit, e as daqui (.github/actions/).
# Só runners hospedados pelo GitHub, com rótulo de imagem fixo. Nenhum segredo obrigatório: o único segredo, LEAK_GUARD_EXTRA,
# só chega ao passo do leak-guard.
name: Pipeline

on:
  push:
    branches:
      - develop
      - main

permissions: {}

concurrency:
  group: prism-pipeline-${{ github.ref_name }}
  cancel-in-progress: false
  queue: max

jobs:
  verificar:
    name: Verificar
    uses: ./.github/workflows/verificar.yml
    permissions:
      contents: read

  integrar:
    name: Integrar
    uses: ./.github/workflows/integrar.yml
    permissions:
      contents: read

  seguranca:
    name: Segurança
    uses: ./.github/workflows/seguranca.yml
    permissions:
      contents: read
      security-events: write
    secrets:
      LEAK_GUARD_EXTRA: ${{ secrets.LEAK_GUARD_EXTRA }}

  empacotar:
    name: Empacotar
    needs: [verificar, seguranca]
    uses: ./.github/workflows/empacotar.yml
    permissions:
      contents: read
    with:
      versao: ${{ needs.verificar.outputs.versao }}

  lancar:
    name: Lançar
    needs: [verificar, seguranca, empacotar]
    # `!cancelled()` tira o `success()` implícito: o lançamento roda mesmo com um pacote em falha, mas nunca com `verificar` ou
    # `seguranca` sem sucesso, nunca sem o plano dizer que lança e nunca numa execução cancelada. O `empacotar` só fica de fora
    # se foi pulado (o que `verificar` e `seguranca` com sucesso já impedem: a guarda é para o dia em que o `empacotar` ganhar um `if`).
    if: ${{ !cancelled() && needs.verificar.result == 'success' && needs.seguranca.result == 'success' && needs.verificar.outputs.lanca == 'true' && needs.empacotar.result != 'skipped' }}
    uses: ./.github/workflows/lancar.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.verificar.outputs.tag }}

  paginas:
    name: Páginas
    if: github.ref_name == 'develop'
    uses: ./.github/workflows/paginas.yml
    permissions:
      contents: read
      pages: write
      id-token: write
