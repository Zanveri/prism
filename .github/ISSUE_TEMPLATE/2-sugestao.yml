name: Suggestion
description: Something you would like to be able to do in Prism.
title: "Suggestion: "
body:
  - type: markdown
    attributes:
      value: |
        You can write this issue in English, Portuguese or Spanish.

        Say in one sentence, in the title, what you would like to be able to do. Before submitting, check the "Coming soon" section of
        the documentation site (https://zanveri.github.io/prism/) to see what is already planned. A suggestion becomes work when the
        maintainers assess it (CONTRIBUTING.md). Do not paste passwords, tokens, connection strings with passwords or real data.
  - type: textarea
    id: problema
    attributes:
      label: Problem or need
      description: What are you trying to do today that you cannot, or that takes a lot of effort?
    validations:
      required: true
  - type: textarea
    id: proposta
    attributes:
      label: What you propose
      description: How should it work, from the point of view of whoever uses Prism?
    validations:
      required: true
  - type: textarea
    id: alternativas
    attributes:
      label: Alternatives
      description: What do you do today instead, or what does another database client do?
  - type: dropdown
    id: banco
    attributes:
      label: Database
      multiple: true
      options:
        - PostgreSQL
        - Db2
        - Informix
        - All
  - type: input
    id: sistema
    attributes:
      label: Operating system
  - type: checkboxes
    id: conferido
    attributes:
      label: Before submitting
      options:
        - label: I searched for an identical issue and did not find one.
          required: true
        - label: There is no password, token, connection string or real data in this text or in the screenshots.
          required: true
