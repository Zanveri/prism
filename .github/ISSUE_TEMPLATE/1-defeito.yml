name: Defect
description: Something in Prism does not work as it should.
title: "Defect: "
body:
  - type: markdown
    attributes:
      value: |
        You can write this issue in English, Portuguese or Spanish.

        Describe the defect in one sentence in the title. **If it is a vulnerability, do not use this form**: report it privately,
        through private vulnerability reporting (see SECURITY.md). Do not paste passwords, tokens, connection strings with
        passwords or real data, neither here nor in screenshots.
  - type: input
    id: versao
    attributes:
      label: Prism version
      description: It shows on the sign-in screen, next to the name. If you built from source, the commit.
      placeholder: 0.1.0, 0.2.0-beta.3 or the commit
    validations:
      required: true
  - type: input
    id: sistema
    attributes:
      label: Operating system and version
      placeholder: Windows 11, Ubuntu 24.04, macOS 26…
    validations:
      required: true
  - type: dropdown
    id: banco
    attributes:
      label: Database
      options:
        - PostgreSQL
        - Db2
        - Informix
        - None (the defect does not depend on the database)
    validations:
      required: true
  - type: input
    id: servidor
    attributes:
      label: Database server version
  - type: dropdown
    id: instalacao
    attributes:
      label: How Prism was opened
      options:
        - Installed package (installer, deb, rpm or dmg)
        - Package without installation (zip, AppImage or tar.gz)
        - From source (pnpm dev)
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: aconteceu
    attributes:
      label: What happened
      description: |
        Paste the error message and, if it helps, a screenshot with no real data. The API log is in the logs/ folder of the data
        folder (see CONTRIBUTING.md). Prism does not log passwords, connection strings or SQL text; even so, review the log
        before attaching it: it may contain paths from your machine and unexpected error messages.
    validations:
      required: true
  - type: checkboxes
    id: conferido
    attributes:
      label: Before submitting
      options:
        - label: I searched for an identical issue and did not find one.
          required: true
        - label: There is no password, token, connection string or real data in this text or in the screenshots.
          required: true
