<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Prism — Revelar senha de uma conexão</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; min-height: 100vh; background: #0E1114; color: #E6EAF0; color-scheme: dark; scrollbar-color: #38414D #14181D; font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; font-size: 14px; line-height: 22px">
<div aria-hidden="true"><dc-import name="Conexoes" accent="{{accent}}" hint-size="100%,1200px"></dc-import></div>
<div style="position: absolute; inset: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(6, 8, 10, 0.72)">
<div role="dialog" aria-modal="true" aria-labelledby="rv-titulo" style="width: 100%; max-width: 440px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; padding: 24px; background: #1B2027; border: 1px solid #38414D; border-radius: 10px; box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5)">
<div style="display: flex; align-items: center; gap: 12px">
<span style="flex: none; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border: 1px solid #38414D; border-radius: 8px; color: #E6EAF0"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="7" width="9" height="6.5" rx="1"></rect><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"></path></svg></span>
<h2 id="rv-titulo" style="margin: 0; font-size: 18px; line-height: 24px; font-weight: 600">Confirme a sua senha</h2>
</div>
<p style="margin: 0; color: #B4BCC8">Para exibir a senha de <b style="color: #E6EAF0; font-family: 'IBM Plex Mono', 'Cascadia Mono', Consolas, monospace; font-size: 13px; font-weight: 500">prism_leitura</b> em <b style="color: #E6EAF0; font-weight: 600">ERP Corporativo</b>, digite a sua senha do Prism.</p>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="rv-senha" style="font-size: 13px; color: #B4BCC8">Sua senha do Prism</label>
<input id="rv-senha" type="password" autocomplete="current-password" style="width: 100%; height: 44px; box-sizing: border-box; padding: 0 12px; background: #14181D; border: 1px solid {{accent}}; border-radius: 6px; color: #E6EAF0; font: inherit">
</div>
<div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 12px; padding-top: 4px">
<a href="Conexoes.dc.html" style="display: flex; align-items: center; height: 40px; padding: 0 16px; border: 1px solid #38414D; border-radius: 6px; color: #E6EAF0; text-decoration: none">Cancelar</a>
<button type="button" style="display: flex; align-items: center; height: 40px; padding: 0 20px; border: 0; border-radius: 6px; background: {{accent}}; color: #14181D; font: inherit; font-weight: 600; cursor: pointer">Exibir senha</button>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F2B644","options":["#F2B644","#7DB2FF","#5ED3A3","#F591B6"]},"$preview":{"width":1440,"height":1200}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#F2B644' };
}
}
</script>
</body>
</html>
