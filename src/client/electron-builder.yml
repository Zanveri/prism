# Empacotamento do app: `pnpm dist -- <plataforma>` (`win`, `linux` ou `mac`) gera os pacotes da RN-ABERTO-006, e
# `pnpm dist:dir` só a pasta sem instalador (`--dir`), para conferir. Sem publicação (`--publish never`) e sem certificado:
# nenhum token, certificado ou segredo entra aqui. Só o macOS leva assinatura, a ad hoc (veja o bloco `mac`), que não usa nenhum.
appId: com.zanveri.prism
productName: Prism
# O mesmo padrão em todos os alvos: `Prism-<versão>-<sistema>-<arquitetura>.<extensão>`, sem espaço no nome.
# A versão é a do `package.json`, o único lugar onde ela mora (RN-VERSAO-003).
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

directories:
  output: release
  buildResources: build

# Só o que o app usa. As dependências são todas devDependencies e o Vite já as empacotou em `out/`,
# então `node_modules` não entra. Ficam de fora, por não estarem aqui: `.api-dev/`, `.api-publish/`,
# `resources/` (a API vai por `extraResources`), `src/`, `electron/` e `scripts/`.
files:
  - out/**
  - package.json

# `resources/api` -> `<pacote>/resources/api` (o `main.ts` inicia o executável da API de lá).
# Da API ficam de fora o que o `dotnet publish` gera e ela não usa: símbolos de depuração (`.pdb`), o `web.config` da
# hospedagem no IIS e o manifesto de ativos estáticos (a API não serve arquivo nenhum).
# Avisos de licença em `resources/` de todo pacote (RN-ABERTO-001), copiados como estão (`scripts/licenses.mjs` tem os mesmos
# caminhos e o `dist` os confere antes de empacotar):
#   LICENSE e NOTICE do projeto, da raiz do repositório;
#   `licenses/ibm-plex-*/LICENSE`: as fontes vão dentro do app e a SIL OFL 1.1 pede o texto junto de cada cópia;
#   `licenses/dotnet/`: `LICENSE.txt` e `ThirdPartyNotices.txt` do .NET, cujo runtime vai junto da API autocontida. O `build:api`
#   os traz da instalação do `dotnet` para `resources/licenses/dotnet` (fora do git).
extraResources:
  - from: resources/api
    to: api
    filter:
      - "**/*"
      - "!**/*.pdb"
      - "!web.config"
      - "!*.staticwebassets.endpoints.json"
  - from: ../../LICENSE
    to: LICENSE
  - from: ../../NOTICE
    to: NOTICE
  - from: node_modules/@fontsource/ibm-plex-sans/LICENSE
    to: licenses/ibm-plex-sans/LICENSE
  - from: node_modules/@fontsource/ibm-plex-mono/LICENSE
    to: licenses/ibm-plex-mono/LICENSE
  - from: resources/licenses/dotnet
    to: licenses/dotnet

# Não há módulo nativo no app.
npmRebuild: false

# Windows: instalador e versão portátil (zip). O ícone da janela e do splash é o `.ico` em `resources/` (`main.ts`).
win:
  target:
    - target: nsis
      arch: x64
    - target: zip
      arch: x64
  icon: build/icon.ico
  extraResources:
    - from: build/icon.ico
      to: icon.ico

# O atualizador do Prism (seção 17 da especificação, `electron/update/`) baixa o instalador inteiro e o confere por soma
# SHA-256: o `.blockmap`, que serve ao download por diferença do electron-updater, não é usado.
#
# O instalador pede administrador e, sem a permissão, instala só para o usuário (seção 25, RN-INSTALA-001 a 004). É o instalador
# assistido (`oneClick: false`): o modelo do electron-builder com os dois modos e o plugin UAC. Sem `perMachine`, o manifesto não
# exige administrador, e quem pede a permissão, decide o modo e pula a página da escolha é `build/installer.nsh`.
# `guid` é o que o electron-builder calcularia do `appId` (UUID v5; `scripts/builder-config.test.ts` confere): é o nome das chaves
# do registro da instalação, então a de uma versão anterior é achada e atualizada. O app (`electron/update/install-scope.ts`) e a
# conferência da pipeline (`scripts/ci/check-windows-installer.sh`) leem o modo da instalação dessas chaves.
nsis:
  differentialPackage: false
  oneClick: false
  guid: d551cb2c-c57f-514a-ba30-6878b60cf922
  include: build/installer.nsh

# Linux: AppImage (roda na maioria das distribuições sem instalar), `.deb`, `.rpm` e `tar.gz`. O ícone da janela e do
# splash é o PNG de 512 px em `resources/` (`main.ts`); o do sistema é o conjunto de `build/icons/<N>x<N>.png`.
linux:
  target:
    - target: AppImage
      arch: x64
    - target: deb
      arch: x64
    - target: rpm
      arch: x64
    - target: tar.gz
      arch: x64
  icon: build/icons
  executableName: prism
  # O Electron usa o `desktopName` do `package.json` (`prism.desktop`) como app_id e WM_CLASS: é o que liga a janela aberta ao
  # `.desktop` e ao ícone dela na barra de tarefas (RN-MARCA-001). Com `syncDesktopName`, o arquivo `.desktop` do pacote tem esse
  # mesmo nome e o `StartupWMClass` dele é `prism`. O nome é o do `executableName` mais `.desktop`.
  syncDesktopName: true
  category: Development
  synopsis: Cliente de banco de dados
  description: Cliente de banco de dados para Informix, Db2 e PostgreSQL.
  maintainer: Zanveri
  extraResources:
    - from: build/icon.png
      to: icon.png

# O nome do pacote é `prism` (o `name` do `package.json`, `prism-client`, é o do projeto de interface, não o do produto).
# `depends` substitui a lista padrão do electron-builder, então ela vem inteira, com o que ele esquece e o Chromium pede:
# `libgbm1` (`mesa-libgbm`) e `libasound2` (`alsa-lib`). Num Ubuntu mínimo, sem eles o app nem abre.
deb:
  packageName: prism
  packageCategory: devel
  depends: [libgtk-3-0, libnotify4, libnss3, libxss1, libxtst6, xdg-utils, libatspi2.0-0, libuuid1, libsecret-1-0, libgbm1, libasound2]
rpm:
  packageName: prism
  packageCategory: Development/Tools
  depends: [gtk3, libnotify, nss, libXScrnSaver, "(libXtst or libXtst6)", xdg-utils, at-spi2-core, "(libuuid or libuuid1)", "(mesa-libgbm or libgbm1)", "(alsa-lib or libasound2)"]

# macOS: `dmg` e `zip`, para Apple Silicon e Intel. Sem `arch` nos alvos de propósito: a arquitetura vem do `--arm64` ou do
# `--x64` que o `dist.mjs` passa (um por vez, porque há uma API só em `resources/api`); com `arch` aqui o electron-builder
# gera as duas de uma vez, e uma levaria a API da arquitetura errada. O ícone é o do pacote.
#
# ASSINATURA AD HOC (issue #33), sem conta de desenvolvedor da Apple, sem Developer ID e sem notarização. Antes era `identity: null`
# (nada assinado), e o macOS dá como "danificado" um app baixado da internet sem assinatura válida, o que só o `sudo xattr -cr` resolvia.
# O que cada linha faz, conferido no `app-builder-lib` 26.15 e no `@electron/osx-sign` 1.3 instalados:
#   `identity: "-"` é o pedido explícito de assinatura ad hoc (sem ele, o electron-builder procura um certificado e, não achando,
#     pula a assinatura). O `-` vira `codesign --sign -`: não lê certificado nem chave, e no runner sem certificado a
#     busca na keychain (`security find-identity`) volta vazia e cai na identidade ad hoc. O `@electron/osx-sign` assina todo
#     arquivo binário de dentro do app, do mais fundo para o mais raso (a API .NET e as bibliotecas dela em `Resources/api`,
#     o Electron Framework, os helpers), e depois o `.app`, e confere o conjunto com `codesign --verify --deep --strict`.
#   `hardenedRuntime: false`: o padrão é ligado. Sem `entitlements` neste arquivo, o electron-builder aplica ao app e a cada arquivo de
#     dentro o modelo dele (`templates/entitlements.mac.plist`), que já traz `disable-library-validation` (e os direitos de JIT e de
#     memória executável do V8 e do .NET), então a validação de bibliotecas não recusaria o Electron Framework nem com o Hardened
#     Runtime ligado. Ele fica desligado porque, sem notarização, nada precisa dele. Um arquivo de entitlements próprio teria de manter
#     `disable-library-validation` enquanto a assinatura for ad hoc (o `app-builder-lib` avisa quando falta). Conferido só na leitura
#     da fonte: não foi visto num Mac.
#   `notarize: false`: a notarização nunca roda aqui, nem se `APPLE_ID` e companhia estiverem no ambiente (ela exige Developer ID).
# O `dist.mjs` tira `CSC_*` do ambiente do electron-builder no macOS: com `CSC_LINK` ele importaria um certificado numa keychain
# temporária, e com um certificado na keychain cujo nome tivesse `-` ele o escolheria no lugar do ad hoc. A assinatura é pulada
# pelo electron-builder só em pull request (`GITHUB_BASE_REF`); a pipeline só empacota em `push`, então não é o caso.
# O QUE ISSO DÁ: o macOS deixa de dizer "danificado". Na primeira abertura diz que não pode verificar o app, e a pessoa o abre uma vez,
# por Ajustes do Sistema › Privacidade e Segurança › "Abrir Mesmo Assim" (macOS 15 em diante), ou pelo clique com o botão direito
# › Abrir (até o macOS 14). Não é identidade de desenvolvedor: o Gatekeeper continua avisando, e só a notarização tira o aviso.
# NÃO VERIFICADO: não há Mac aqui e o pacote de macOS só sai na estável, então nenhum pacote assinado desta forma foi aberto
# num Mac de verdade (nem o `codesign --verify --deep --strict` do fim do `@electron/osx-sign` foi visto passar com a API .NET
# dentro). A primeira estável com este arquivo é o teste; se o `--strict` recusar o pacote, `strictVerify: false` é o ajuste.
mac:
  target:
    - dmg
    - zip
  icon: build/icon.icns
  category: public.app-category.developer-tools
  identity: "-"
  hardenedRuntime: false
  notarize: false
